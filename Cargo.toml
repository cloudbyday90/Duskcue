[workspace]
resolver = "3"
members = [
    "server",
    "crates/types",
    "crates/db",
    "clients/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0"

[workspace.dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip", "set-header", "request-id"] }
governor = "0.6"
nonzero_ext = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
ring = "0.17"
maxminddb = { version = "0.28", features = ["mmap"] }
validator = { version = "0.20", features = ["derive"] }
tokio-process-tools = "0.11"
landlock = "0.4"
seccompiler = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = "3"
sqlx = { version = "0.9", features = ["postgres", "runtime-tokio", "uuid", "chrono", "json", "migrate", "sqlx-toml"] }
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }
jsonwebtoken = "10.3"
config = "0.15"
clap = { version = "4", features = ["derive", "env"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-stream = { version = "0.1", features = ["sync"] }
mimalloc = "0.1"
tracing-appender = "0.2"
tracing-error = "0.2"
dirs = "6"
keyring = "4.1.2"
arc-swap = "1"
metrics = "0.24"
metrics-exporter-prometheus = "0.18"
ipnet = "2"
sysinfo = "0.34"
rand = "0.9"
webauthn-rs = { version = "0.6.1-dev", features = ["danger-allow-state-serialisation", "danger-credential-internals"] }
dashmap = "5.5"
url = "2"
base64 = "0.22"
ignore = "0.4"
blake3 = "1"
regex = "1"
croner = "3"
notify = "8"
notify-debouncer-full = "0.7"
quick-xml = "0.40"
async-trait = "0.1"
urlencoding = "2"
flate2 = "1"
zip = "2"
tar = "0.4"
libc = "0.2"
chromaprint-next = "0.1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
webp = { version = "0.3", default-features = false }
ab_glyph = "0.2"
resvg = "0.47"
fluent-templates = "0.14"
fluent-bundle = "0.16"
fluent-langneg = "0.13"
unic-langid = "0.9"
