name: Client CI and Smoke Harness

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/client-ci-smoke.yml
      - docker-compose.yml
      - docs/api/**
      - docs/branding/assets/store/android-tv/**
      - docs/ci/**
      - docs/design/CLIENT_PLATFORM_READINESS.md
      - docs/design/CLIENT_ACCESSIBILITY_INPUT.md
      - docs/design/CLIENT_DESIGN_ASSETS.md
      - docs/design/CLIENT_DIAGNOSTICS.md
      - docs/design/CLIENT_DEVICE_LAB.md
      - docs/design/CLIENT_RELEASE_READINESS.md
      - docs/design/ANDROID_TV.md
      - docs/design/TV_PLATFORM_SURFACES.md
      - clients/tv/android/**
      - scripts/client-smoke-harness.mjs
      - scripts/android-tv-emulator-smoke.mjs
      - scripts/verify-android-tv-release-readiness.mjs
      - scripts/nvidia-shield-validation.mjs
      - scripts/verify-nvidia-shield-validation.mjs
      - scripts/verify-client-*.mjs
      - scripts/verify-android-tv-ci.mjs
      - scripts/verify-playback-conformance.mjs
      - scripts/verify-auth-conformance.mjs
      - scripts/verify-tv-*.mjs
      - scripts/verify-accessibility-input.mjs
      - scripts/verify-design-assets.mjs
      - scripts/verify-device-lab.mjs
      - scripts/verify-release-readiness.mjs
  push:
    branches: [main]
    paths:
      - .github/workflows/client-ci-smoke.yml
      - docker-compose.yml
      - docs/api/**
      - docs/branding/assets/store/android-tv/**
      - docs/ci/**
      - docs/design/CLIENT_PLATFORM_READINESS.md
      - docs/design/CLIENT_ACCESSIBILITY_INPUT.md
      - docs/design/CLIENT_DESIGN_ASSETS.md
      - docs/design/CLIENT_DIAGNOSTICS.md
      - docs/design/CLIENT_DEVICE_LAB.md
      - docs/design/CLIENT_RELEASE_READINESS.md
      - docs/design/ANDROID_TV.md
      - docs/design/TV_PLATFORM_SURFACES.md
      - clients/tv/android/**
      - scripts/client-smoke-harness.mjs
      - scripts/android-tv-emulator-smoke.mjs
      - scripts/verify-android-tv-release-readiness.mjs
      - scripts/nvidia-shield-validation.mjs
      - scripts/verify-nvidia-shield-validation.mjs
      - scripts/verify-client-*.mjs
      - scripts/verify-android-tv-ci.mjs
      - scripts/verify-playback-conformance.mjs
      - scripts/verify-auth-conformance.mjs
      - scripts/verify-tv-*.mjs
      - scripts/verify-accessibility-input.mjs
      - scripts/verify-design-assets.mjs
      - scripts/verify-device-lab.mjs
      - scripts/verify-release-readiness.mjs
  workflow_dispatch:
    inputs:
      run_docker_smoke:
        description: Run the Docker :48027 smoke harness
        required: true
        default: false
        type: boolean
      run_platform_smoke:
        description: Run heavier desktop/mobile platform smoke jobs
        required: true
        default: false
        type: boolean
      run_android_tv_emulator_smoke:
        description: Run the Android TV AVD install, Leanback launcher, and deep-link smoke
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  shared_contract_validation:
    name: Shared Contract Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Show Node version
        run: node --version

      - name: Verify shared client contracts
        run: node scripts/verify-client-contracts.mjs

      - name: Verify binding generation readiness
        run: node scripts/verify-client-bindings.mjs

  fixture_drift:
    name: Fixture Drift
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: shared_contract_validation
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Verify client fixtures
        run: node scripts/verify-client-fixtures.mjs

      - name: Verify playback conformance
        run: node scripts/verify-playback-conformance.mjs

      - name: Verify auth conformance
        run: node scripts/verify-auth-conformance.mjs

      - name: Verify TV deep-link conformance
        run: node scripts/verify-tv-deeplink-conformance.mjs

      - name: Verify TV surface fixtures
        run: node scripts/verify-tv-surface-fixtures.mjs

      - name: Verify accessibility and input fixtures
        run: node scripts/verify-accessibility-input.mjs

      - name: Verify design assets
        run: node scripts/verify-design-assets.mjs

      - name: Verify diagnostics fixtures
        run: node scripts/verify-client-diagnostics.mjs

      - name: Verify device lab fixtures
        run: node scripts/verify-device-lab.mjs

      - name: Verify release readiness fixtures
        run: node scripts/verify-release-readiness.mjs

      - name: Verify client CI smoke fixtures
        run: node scripts/verify-client-ci-smoke.mjs

  binding_generation_readiness:
    name: Binding Generation Readiness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: shared_contract_validation
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Verify TypeScript Dart Kotlin Swift binding targets
        run: node scripts/verify-client-bindings.mjs

  tv_console_fixture_smoke:
    name: TV and Console Fixture Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: fixture_drift
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Verify TV and device-lab baseline
        run: |
          node scripts/verify-tv-deeplink-conformance.mjs
          node scripts/verify-tv-surface-fixtures.mjs
          node scripts/verify-device-lab.mjs

  android_tv_conformance:
    name: Android TV Conformance
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: fixture_drift
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Temurin 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Verify Android TV contract and conformance fixtures
        run: |
          node scripts/verify-client-contracts.mjs
          node scripts/verify-client-fixtures.mjs
          node scripts/verify-playback-conformance.mjs
          node scripts/verify-auth-conformance.mjs
          node scripts/verify-tv-deeplink-conformance.mjs
          node scripts/verify-tv-surface-fixtures.mjs
          node scripts/verify-accessibility-input.mjs
          node scripts/verify-client-diagnostics.mjs
          node scripts/client-smoke-harness.mjs --plan
          node scripts/verify-client-ci-smoke.mjs
          node scripts/verify-android-tv-ci.mjs
          node scripts/verify-android-tv-release-readiness.mjs
          node scripts/verify-nvidia-shield-validation.mjs

      - name: Run Android TV unit, lint, and debug build checks
        working-directory: clients/tv/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 --stacktrace :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Upload Android TV debug evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: duskcue-android-tv-debug-evidence
          if-no-files-found: warn
          retention-days: 14
          path: |
            clients/tv/android/app/build/outputs/apk/debug/app-debug.apk
            clients/tv/android/app/build/reports/lint-results-debug.html
            clients/tv/android/app/build/test-results/testDebugUnitTest

  android_tv_emulator_smoke:
    name: Android TV Emulator Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: android_tv_conformance
    if: github.event_name == 'workflow_dispatch' && inputs.run_android_tv_emulator_smoke
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Temurin 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build Android TV debug APK
        working-directory: clients/tv/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 --stacktrace :app:assembleDebug

      - name: Enable emulator virtualization
        run: sudo chmod 666 /dev/kvm

      - name: Install and smoke Android TV AVD
        uses: ReactiveCircus/android-emulator-runner@c9c93e6ba9c4194322e114c40970d5983d9a07cc
        with:
          api-level: 36
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: node scripts/android-tv-emulator-smoke.mjs --apk clients/tv/android/app/build/outputs/apk/debug/app-debug.apk

  docker_smoke_plan:
    name: Docker Smoke Plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: fixture_drift
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Validate harness plan
        run: node scripts/client-smoke-harness.mjs --plan

      - name: Verify client CI smoke fixture pack
        run: node scripts/verify-client-ci-smoke.mjs

  docker_smoke_run_manual:
    name: Docker Smoke Run Manual
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: docker_smoke_plan
    if: github.event_name == 'workflow_dispatch' && inputs.run_docker_smoke
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Run Docker public-surface smoke harness
        run: node scripts/client-smoke-harness.mjs --run

  desktop_tauri_smoke:
    name: Desktop Tauri Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'workflow_dispatch' && inputs.run_platform_smoke
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Linux Tauri prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget

      - name: Install web dependencies
        run: npm ci --prefix clients/web

      - name: Install desktop dependencies
        run: npm ci --prefix clients/desktop

      - name: Build shared web UI for Tauri
        run: npm --prefix clients/desktop run build

  mobile_flutter_smoke:
    name: Mobile Flutter Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'workflow_dispatch' && inputs.run_platform_smoke
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Flutter SDK
        run: |
          curl -fsSL https://storage.googleapis.com/flutter_infra_release/releases/releases_linux.json -o "$RUNNER_TEMP/flutter-releases.json"
          python3 - "$RUNNER_TEMP/flutter-releases.json" <<'PY' > "$RUNNER_TEMP/flutter-archive"
          import json
          import sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          release = next(item for item in data["releases"] if item["channel"] == "stable")
          print(release["archive"])
          PY
          archive="$(cat "$RUNNER_TEMP/flutter-archive")"
          curl -fsSL "https://storage.googleapis.com/flutter_infra_release/releases/$archive" -o "$RUNNER_TEMP/flutter.tar.xz"
          tar -xf "$RUNNER_TEMP/flutter.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Show Flutter version
        run: |
          flutter config --no-analytics
          flutter --version

      - name: Resolve Flutter dependencies
        working-directory: clients/mobile
        run: flutter pub get

      - name: Analyze mobile client
        working-directory: clients/mobile
        run: flutter analyze

      - name: Run mobile tests
        working-directory: clients/mobile
        run: flutter test

      - name: Build Android debug APK
        working-directory: clients/mobile
        run: flutter build apk --debug
