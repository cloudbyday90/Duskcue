name: Client Packaging Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/client-packaging.yml
      - clients/desktop/**
      - clients/mobile/**
      - clients/web/**
      - docs/api/**
      - docs/ci/**
      - docs/design/DESKTOP_MOBILE_CLIENTS.md
      - scripts/verify-client-contracts.mjs
  push:
    branches: [main]
    paths:
      - .github/workflows/client-packaging.yml
      - clients/desktop/**
      - clients/mobile/**
      - clients/web/**
      - docs/api/**
      - docs/ci/**
      - docs/design/DESKTOP_MOBILE_CLIENTS.md
      - scripts/verify-client-contracts.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: Tauri ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Linux Tauri prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget

      - name: Show tool versions
        shell: pwsh
        run: |
          node --version
          npm --version
          rustc --version
          cargo --version

      - name: Install web dependencies
        shell: pwsh
        run: npm ci --prefix clients/web

      - name: Install desktop dependencies
        shell: pwsh
        run: npm ci --prefix clients/desktop

      - name: Build shared web UI for Tauri
        shell: pwsh
        run: npm --prefix clients/desktop run build

      - name: Build Tauri package smoke
        shell: pwsh
        run: npm --prefix clients/desktop run tauri -- build --debug

  mobile-android:
    name: Flutter Android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Flutter SDK
        run: |
          curl -fsSL https://storage.googleapis.com/flutter_infra_release/releases/releases_linux.json -o "$RUNNER_TEMP/flutter-releases.json"
          python3 - "$RUNNER_TEMP/flutter-releases.json" <<'PY' > "$RUNNER_TEMP/flutter-archive"
          import json
          import sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          release = next(item for item in data["releases"] if item["channel"] == "stable")
          print(release["archive"])
          PY
          archive="$(cat "$RUNNER_TEMP/flutter-archive")"
          curl -fsSL "https://storage.googleapis.com/flutter_infra_release/releases/$archive" -o "$RUNNER_TEMP/flutter.tar.xz"
          tar -xf "$RUNNER_TEMP/flutter.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Show Flutter version
        run: |
          flutter config --no-analytics
          flutter --version

      - name: Resolve Flutter dependencies
        working-directory: clients/mobile
        run: flutter pub get

      - name: Analyze mobile client
        working-directory: clients/mobile
        run: flutter analyze

      - name: Run mobile unit and widget tests
        working-directory: clients/mobile
        run: flutter test

      - name: Run mobile integration smoke test
        working-directory: clients/mobile
        run: flutter test integration_test/app_smoke_test.dart

      - name: Build Android debug APK
        working-directory: clients/mobile
        run: flutter build apk --debug

      - name: Build Android release APK
        working-directory: clients/mobile
        run: flutter build apk --release

  mobile-ios:
    name: Flutter iOS Metadata
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Flutter SDK
        run: |
          curl -fsSL https://storage.googleapis.com/flutter_infra_release/releases/releases_macos.json -o "$RUNNER_TEMP/flutter-releases.json"
          python3 - "$RUNNER_TEMP/flutter-releases.json" <<'PY' > "$RUNNER_TEMP/flutter-archive"
          import json
          import platform
          import sys
          arch = "arm64" if platform.machine() == "arm64" else "x64"
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          candidates = [
              item for item in data["releases"]
              if item["channel"] == "stable" and item.get("dart_sdk_arch") in (None, arch)
          ]
          print(candidates[0]["archive"])
          PY
          archive="$(cat "$RUNNER_TEMP/flutter-archive")"
          curl -fsSL "https://storage.googleapis.com/flutter_infra_release/releases/$archive" -o "$RUNNER_TEMP/flutter.zip"
          unzip -q "$RUNNER_TEMP/flutter.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Show Flutter version
        run: |
          flutter config --no-analytics
          flutter --version

      - name: Validate iOS metadata
        run: |
          plutil -lint clients/mobile/ios/Runner/Info.plist
          plutil -lint clients/mobile/ios/Runner/Assets.xcassets/AppIcon.appiconset/Contents.json

      - name: Resolve Flutter dependencies
        working-directory: clients/mobile
        run: flutter pub get

      - name: Analyze mobile client
        working-directory: clients/mobile
        run: flutter analyze

      - name: Run mobile tests
        working-directory: clients/mobile
        run: flutter test

      - name: Build iOS simulator when generated Xcode target exists
        working-directory: clients/mobile
        run: |
          if grep -q "PBXNativeTarget" ios/Runner.xcodeproj/project.pbxproj; then
            flutter build ios --simulator --no-codesign
          else
            echo "::notice::iOS simulator package build skipped because the current scaffold has metadata but no generated Runner native target."
          fi
