services:
  postgres:
    image: ${DUSKCUE_MIGRATION_POSTGRES_IMAGE:-postgres:18-alpine}
    environment:
      POSTGRES_DB: ${DUSKCUE_MIGRATION_POSTGRES_DB:-duskcue_migration}
      POSTGRES_USER: ${DUSKCUE_MIGRATION_POSTGRES_USER:-duskcue}
      POSTGRES_PASSWORD: ${DUSKCUE_MIGRATION_POSTGRES_PASSWORD:?DUSKCUE_MIGRATION_POSTGRES_PASSWORD is required}
      POSTGRES_INITDB_ARGS: "--data-checksums"
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:${DUSKCUE_MIGRATION_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    volumes:
      - postgres-data:/var/lib/postgresql/data
    stop_grace_period: 30s

volumes:
  postgres-data:
