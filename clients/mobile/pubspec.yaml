name: duskcue_mobile
description: Duskcue mobile client
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cached_network_image: ^3.4.1
  connectivity_plus: ^7.2.0
  crypto: ^3.0.6
  cupertino_icons: ^1.0.9
  dio: ^5.10.0
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.1
  flutter_cache_manager: ^3.4.1
  flutter_local_notifications: ^22.0.1
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^10.3.1
  go_router: ^17.3.0
  json_annotation: ^4.12.0
  video_player: ^2.11.1

dev_dependencies:
  build_runner: ^2.15.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  json_serializable: ^6.14.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
